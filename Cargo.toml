[package]
name = "satisfactory_calculator"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.10.5"
minilp = "0.2.2"
microlp = "0.8.0"
web-time = "1"
ndarray = "0.15.6"
wasm-bindgen = "0.2"
# DSP seed → galaxy (DoubleUTH/DSP-Seed-Finder, Apache-2.0, vendored; vendor/dsp_seed_gen/NOTICE.md)
dsp_seed_gen = { path = "vendor/dsp_seed_gen" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
reqwest = { version = "0.11.18", features = ["blocking", "json"] }

[profile.release]
opt-level = 3
lto = true
