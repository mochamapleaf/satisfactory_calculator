[package]
name = "dsp_seed_gen"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DSP galaxy generator: data/ and worldgen/ of DoubleUTH/DSP-Seed-Finder (Apache-2.0) @ c050ff02, with per-vein node counts"

[lib]
path = "src/lib.rs"

[dependencies]
once_cell = "1.21"
# exact version: another libm could round differently and change the galaxy (fingerprint tests would fail)
libm = "=0.2.11"
serde = { version = "1.0", features = ["derive", "rc"] }
